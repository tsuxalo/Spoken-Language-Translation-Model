# "full" means full accepted data; this candidate uses LoRA, not full fine-tuning.
kind: direct_s2tt
dataset:
  id: McGill-NLP/NaijaS2ST
  revision: 898f51582750fe244693794f22e3f4b32c5baf95
  config_name: default
  train_split: train
  validation_split: derived_from_train
  test_split: dev
  target_column: target_text
  source_language: hausa
  target_language: english
  sampling_rate: 16000
  max_duration_seconds: 30.0
  derive_validation_from_train: true
  validation_fraction: 0.1
  pairing_artifacts_dir: artifacts/data/naija_s2st
  require_pairing_artifacts: false
  tracked_audit_path: reports/naija_s2st_audit_summary.json
model:
  id: openai/whisper-small
  revision: 973afd24965f72e36ca33b3055d56a652f456b4d
  language: Hausa
  task: translate
  efficiency_strategy: lora
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_targets: [q_proj, v_proj]
training:
  output_dir: artifacts/checkpoints/whisper-small-ha-en-s2tt
  seed: 42
  learning_rate: 0.0001
  train_batch_size: 2
  eval_batch_size: 2
  gradient_accumulation_steps: 8
  num_train_epochs: 10
  warmup_ratio: 0.05
  max_grad_norm: 1.0
  gradient_checkpointing: true
  eval_strategy: epoch
  save_strategy: epoch
  save_total_limit: 2
  early_stopping_patience: 2
  precision: auto
generation:
  max_new_tokens: 225
  num_beams: 1
tracking:
  run_name: whisper-small-ha-en-s2tt-from-base
