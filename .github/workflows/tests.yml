name: cpu-tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU-safe test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --no-deps
          python -m pip install numpy scipy sacrebleu pytest pyyaml
      - name: Unit tests (no checkpoint downloads)
        run: pytest
      - name: Syntax check
        run: python -m compileall -q src data_prep.py train.py inference.py evaluate_asr.py evaluate_s2tt.py estimate_experiment.py
      - name: Static checks
        run: |
          python -m pip install ruff
          ruff check .
